version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: weather-mysql
    environment:
      MYSQL_DATABASE: weatherdb
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql-data:/var/lib/mysql

  python-ml:
    build: ./ml_service
    container_name: weather-python-ml
    ports:
      - "5000:5000"
    environment:
      - PORT=5000

  spring-backend:
    build: ./backend
    container_name: weather-spring-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql-db
      - python-ml
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/weatherdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
      - PYTHON_ML_SERVICE_URL=http://python-ml:5000/predict
      - PYTHON_ML_SERVICE_TRAIN_URL=http://python-ml:5000/train

volumes:
  mysql-data:
