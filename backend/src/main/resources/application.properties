server.port=8080

# Application Name
spring.application.name=ai-weather-backend

# MySQL Configuration (Default target)
spring.datasource.url=jdbc:mysql://localhost:3306/weatherdb
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# OpenWeatherMap API Configuration (Optional API key)
weather.api.key=YOUR_API_KEY
weather.api.city=Pune

# Python ML Microservice Endpoint
python.ml.service.url=http://localhost:5000/predict
python.ml.service.train-url=http://localhost:5000/train
